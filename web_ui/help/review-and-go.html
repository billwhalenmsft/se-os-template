  <h1>Review and go</h1>
  <table style="border-collapse:collapse;width:100%">
    <thead><tr><th style="text-align:left">Level</th><th style="text-align:left">Authority</th></tr></thead>
    <tbody>
      <tr><td>L0</td><td>Observe only</td></tr>
      <tr><td>L1</td><td>Draft or recommend</td></tr>
      <tr><td>L2</td><td>Local and reversible action</td></tr>
      <tr><td>L3</td><td>External or durable write; exact approval required</td></tr>
    </tbody>
  </table>
  <p>Approval for one L3 action does not authorize another. Deployment and workspace registration are separate decisions.</p>
