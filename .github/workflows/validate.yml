name: Validate public template

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate privacy and portability
        run: python scripts/validate_template.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
